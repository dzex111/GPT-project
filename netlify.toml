[build]
  command = "connection=$(node -e \"process.stdout.write(require('@netlify/database').getConnectionString())\") && DATABASE_URL=\"$connection\" DIRECT_URL=\"$connection\" npx prisma migrate deploy && npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
